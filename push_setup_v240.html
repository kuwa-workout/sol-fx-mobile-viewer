<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#091323">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SOL FX LAB">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./push_setup_v240.css">
  <script defer src="./push_setup_v240.js"></script>
  <title>SOL FX LAB | 通知設定 v2.4</title>
</head>
<body>
<main>
  <a href="./" class="back">← SOL FX LAB に戻る</a>
  <h1>🔔 SOL FX LAB<br>通知登録 v2.4</h1>
  <p>iPhoneのホーム画面から開いたアプリで設定してな。通知の許可は、下のボタンを押したときだけ要求するで。</p>
  <p class="info" id="capability" role="status">対応状況を確認中…</p>
  <label for="publicKey">VAPID公開鍵（秘密鍵ではありません）</label>
  <input id="publicKey" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="公開鍵を貼り付け" maxlength="200">
  <button id="subscribe" type="button">通知を許可して端末を登録</button>
  <p class="info" id="status" role="status" aria-live="polite">まだ登録してへんで。</p>
  <section id="output" hidden>
    <h2>この端末の登録情報</h2>
    <p>以下は通知の宛先情報や。<strong>公開リポジトリに保存せず、非公開側のGitHub Secretsに登録してな。</strong></p>
    <textarea id="subscription" readonly rows="7" spellcheck="false"></textarea>
    <button id="copy" type="button">登録情報をコピー</button>
    <p class="small">端末の登録情報は、この画面からサーバーへ自動送信しません。鍵・通知データをGitHub Pagesには保存しません。</p>
  </section>
  <p class="small">この画面は登録専用。売買注文は行わず、通知もこの画面からは送られません。</p>
</main>
</body>
</html>
